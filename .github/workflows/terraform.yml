name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  terraform:
    name: Terraform CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/prod

    steps:

      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Azure Login
      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "dfa40f6a-4dbd-4ab5-b3b3-59fd4aaf47c5" \
            --password "fUx8Q~Z7uDdxp-loUIBXMhf.S3y3gPCEDHRdDcc." \
            --tenant "71de1bb5-ad71-4d44-947d-ea6848c11e93"

      # 4. Set Azure Subscription
      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "fc4ff682-f59a-49fa-afe4-086f6b5ac324"

      # 5. Check Azure Login
      - name: Azure Account
        run: az account show

      # 6. Terraform Format
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # 7. Terraform Init
      - name: Terraform Init
        run: terraform init

      # 8. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 9. Terraform Plan
      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars"

      # 10. Terraform Apply
      # Apply ONLY after merge/push to main
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -var-file="terraform.tfvars"